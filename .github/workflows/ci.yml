name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict python/pocketdock/
      - run: uv run bandit -r python/pocketdock/ -c pyproject.toml
      - name: Check license headers
        run: |
          find python/pocketdock -name '*.py' | while read f; do
            head -2 "$f" | grep -q 'SPDX-License-Identifier: BSD-2-Clause' || \
              (echo "Missing license header: $f" && exit 1)
          done

  test:
    # Pinned: on ubuntu-26.04 rootless Podman fails to tear down its network
    # namespace ("rootless netns: kill network process: permission denied").
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        engine: [podman, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --all-extras --python ${{ matrix.python-version }}
      - name: Start Podman
        if: matrix.engine == 'podman'
        run: |
          systemctl --user start podman.socket
          echo "POCKETDOCK_SOCKET=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" >> "$GITHUB_ENV"
          podman build -t pocketdock/minimal-python python/pocketdock/_images/minimal-python/
      - name: Use Docker Engine
        if: matrix.engine == 'docker'
        run: |
          echo "POCKETDOCK_SOCKET=/var/run/docker.sock" >> "$GITHUB_ENV"
          docker version
          docker build -t pocketdock/minimal-python python/pocketdock/_images/minimal-python/
      - name: Run parallel-safe tests
        run: uv run pytest -n auto --ignore=tests/test_persistence_integration.py
      - name: Run serial tests (race-prone)
        run: uv run pytest tests/test_persistence_integration.py --cov-append --cov-fail-under=100

  docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run mkdocs build --strict
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - if: github.event_name == 'push'
        uses: actions/deploy-pages@v4

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run pip-audit
